  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      x-ambs-status: approved
      x-ambs-permission: project.read
      summary: Projects of the current company the caller may see
      description: |
        Needs `project.read`. **Filtered on the server by the scope of the grant**: with `company`, every project of the
        company; with `assigned`, only the projects with an assignment of the caller's membership (`project_assignments`,
        matrix layer 2). A site engineer never sees a project they are not assigned to (S2 acceptance). The filter is the
        server's, never a parameter: the page cannot widen it. A project outside the scope is never listed, and reading it
        by id is `404 not_found`. `item_count` counts the visible projects only.
        A project carries no amount and no contract (`projects` holds no financial column; contracts come after launch, Q1).
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/StatusFilter'
        - name: client_party_id
          in: query
          required: false
          description: Only the projects of this client. A client the caller cannot see gives an empty page, not an error.
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of projects (may be empty)
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
              examples:
                a:
                  $ref: '#/components/examples/ProjectListA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [projects]
      operationId: createProject
      x-ambs-status: approved
      x-ambs-permission: project.write
      summary: Create a project for one client
      description: |
        Needs `project.write` (company scope). `client_party_id` must be a party of the current company with the `client`
        role → otherwise `404 not_found` (another company's party, a party without that role and an unknown id answer the
        same). An archived client gets no new project → `409 client_archived` (*approved* 2026-11-21, O-5). `project_code` is
        optional: left out or empty, the server generates one; it is unique in the company either way → `409 code_taken`
        (*approved* 2026-11-21, O-1). Two projects of one client stay two projects; nothing merges them (S2 acceptance).
        `currency_code` is required and has no default in the contract (ISO 4217, an active currency of the `currencies`
        reference, else `400 invalid_request`); the screen pre-fills it with the company's `base_currency_code`, and the
        user may change it (*approved* 2026-11-21, O-3). `start_date <= end_date` when both are set.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            example:
              client_party_id: SAMPLE-PARTY-B-1
              name: SAMPLE Project B2
              start_date: '2026-12-01'
              currency_code: SAR
      responses:
        '201':
          description: The project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
              examples:
                b:
                  $ref: '#/components/examples/ProjectB1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

