openapi: 3.1.0
info:
  title: AMBS gateway API — company, membership, roles, invitations
  version: 1.2.0-draft
  summary: APPROVED by the owner on 2026-11-21 (slice S1). Contract first (launch plan item 8); screens build on its examples.
  license:
    name: Proprietary — private API of the AMBS platform
    identifier: LicenseRef-AMBS-Proprietary
  description: |
    **APPROVED by the owner on 2026-11-21 (S1, version 1.0.0)**, after the round-4 review fix that separates a missing
    context-generation header (400) from a stale one (409). **Version 1.1.0** carries the round-5 changes the owner
    approved on 2026-11-21: per-company role ids in the examples, the operation-log fingerprint with the sent context
    generation and a 24-hour retention, `self_revocation_denied`, and `my_permissions` in `GET /company`. Critical level (identity and tenant isolation). Placeholders stay
    placeholders until their decision (Q2). Any change to this contract is a new version, reviewed again, and updated in the
    backend repository too (launch plan item 8).

    Scope: slice S1 of the backend plan — the current company, its memberships, the system roles and their permissions,
    and invitations. Table shapes follow the backend architecture document
    (`docs/architecture/AMBS_SaaS_Execution_Architecture_v2_1_AR.md`, lines 281–297, branch
    `feature/commercial-phase1-subscriptions` at `402a784`). Rules follow `docs/ambs-integration/http-contract-draft.md`
    (this repository); section numbers below (§) refer to it.

    Rules that hold for every path:
    - **The company is never taken from the request.** Every company-scoped path reads the tenant from the session context
      (§3.2); no path accepts a `tenant_id` parameter. The only exception is choosing a company (`POST /session/tenant`),
      where the browser proposes and the server checks the membership.
    - **Every mutation is checked against `Origin`** (and `Sec-Fetch-Site` where present) and refused when it is not the
      site's own origin (§4.3). `SameSite=Lax` is an extra layer, not a replacement.
    - **Every mutation carries `X-AMBS-Context-Generation`**: the `context_generation` the page last received (§4.3, §4.6).
      It holds no tenant id and grants no access. **Missing or malformed** → `400 context_generation_required` (a fault in
      the page, not an old tab: shown as an error, never answered by reloading). **A valid value different from the
      session's current one** → `409 tenant_changed`. Either way nothing is done. This stops an old tab acting on another
      company.
    - **Every response carries the session generations** (§3.3, §4.6): `session.generation` and `session.context_generation`
      in the body, on success and on error.
    - **Mutations carry `Idempotency-Key`** (§4.8). The same key with another body is `idempotency_key_reused` (422). The
      operation log keeps the result only: never a `Set-Cookie`, a session id, a context token or any secret.
    - **Errors** use one body (`ErrorBody`) with the codes of §3.3, plus six S1 codes *approved* on 2026-11-21.
    - **401 never clears the session cookie**; only signing out does (§4.2, r9).
    - **No amount** appears anywhere in this contract.
    - Responses are private: `Cache-Control: private, no-store` (§4.7).
    - **Identifiers are opaque strings.** The backend stores UUIDs; clients must not parse them. Examples start with `SAMPLE`.

    **S2 — clients and projects (version 1.2.0-draft): a DRAFT, NOT APPROVED.** Every S2 operation carries
    `x-ambs-status: draft` and names the permission it needs in `x-ambs-permission`. The S1 rules above hold for S2
    unchanged. S2 adds: lists by page (`page`, `page_size`) and search (`q`); archiving instead of deleting; the same
    `404 not_found` for a record of another company, outside the caller's scope, or unknown; no national assumption in
    phone, tax number or currency; no amount and no contract (Q1: contracts after launch); a project points to one client
    only. Its open questions and its differences from the backend documents are listed in
    `docs/proposals/s2-contract-design.md`, and none of them is settled here.

    Not in this version: signing in and signing out (blocked by Q2, the identity provider: placeholders only), creating a
    company at sign-up and the free trial (Q2, Q4), accepting an invitation (needs the signed-in user, Q2), and custom roles
    (*approved* D-API-1: system roles only at launch; custom roles are in `docs/after-launch.md`).
servers:
  - url: /api
    description: The gateway behind the frontend server (same origin). Placeholder until Q5 decides where it runs.
tags:
  - name: session
    description: The session and the choice of company. Sign-in and sign-out are placeholders until Q2.
  - name: company
    description: The current company, read from the session context.
  - name: members
    description: Memberships of the current company. Revoking takes effect from the member's next request.
  - name: roles
    description: The system roles and the permission catalogue. No custom roles at launch (D-API-1).
  - name: invitations
    description: Invitations to the current company. The token is never returned.
  - name: clients
    description: 'DRAFT (S2, 1.2.0-draft): parties seen through their client role (ADR-008).'
  - name: projects
    description: 'DRAFT (S2, 1.2.0-draft): projects, each with one client; no amount, no contract.'
security:
  - sessionCookie: []

paths:
  /session:
    post:
      tags: [session]
      operationId: signIn
      summary: PLACEHOLDER — sign in (blocked by Q2, identity provider)
      description: Shape not defined until Q2 (ARCH-001) is decided. Rotates the session id on success (§4.9).
      x-ambs-status: placeholder
      security: []
      responses:
        '501':
          $ref: '#/components/responses/NotDefined'
    delete:
      tags: [session]
      operationId: signOut
      summary: PLACEHOLDER — sign out (§4.4; final shape after Q2)
      description: |
        The only response that clears the session cookie. Its outcomes are designed in §4.4; the shape waits for Q2.
        Sign-out will not require `X-AMBS-Context-Generation`: a stale tab must still be able to sign out.
      x-ambs-status: placeholder
      responses:
        '501':
          $ref: '#/components/responses/NotDefined'

  /session/memberships:
    get:
      tags: [session]
      operationId: listMyMemberships
      summary: The signed-in user's active memberships, to choose a company
      description: |
        Works before a company is chosen. Lists only the caller's own active memberships; the user comes from the session,
        never from the request. A revoked membership is not listed.
      responses:
        '200':
          description: The caller's active memberships (may be empty)
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [memberships, session]
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: '#/components/schemas/MyMembership'
                  session:
                    $ref: '#/components/schemas/SessionGenerations'
              examples:
                two:
                  value:
                    memberships:
                      - tenant_id: SAMPLE-TENANT-A
                        display_name: SAMPLE Company A
                        role: { id: SAMPLE-ROLE-OWNER-A, name: owner, is_system: true }
                      - tenant_id: SAMPLE-TENANT-B
                        display_name: SAMPLE Company B
                        role: { id: SAMPLE-ROLE-SITE-B, name: site_engineer, is_system: true }
                    session: { generation: 1, context_generation: 0 }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /session/tenant:
    post:
      tags: [session]
      operationId: selectCompany
      summary: Choose or switch the current company (§4.5, §4.9)
      description: |
        The browser proposes `tenant_id`; the server checks an active membership of the session's user. Success issues a
        new context and rotates the session id (§4.9); the new id appears in the `Set-Cookie` of this response only.

        **Refusal is the same whatever the reason:** a company that does not exist, one the user is not a member of, and
        one whose membership was revoked all get `403 tenant_selection_denied` with the same body, so the response tells
        nothing about which companies exist. A refusal changes neither the session nor the current company.

        **Retrying with the same `Idempotency-Key`** (§4.8). The operation log is read before the context generation is
        compared. It stores the result only, never a `Set-Cookie`, a session id or a context token,
        so a retry never receives a cookie. What the browser gets:
        - the original response was lost **before** its headers arrived: the browser still holds the old id, which after
          rotation serves only sign-out for 60 seconds (§4.9) → `409 session_rotated`, no `Set-Cookie`, no result. The user
          signs in again (the approved cost of cancelling cookie recovery, r7);
        - the original response's headers arrived (the browser holds the new id) but its body was lost → `200` with the
          stored result and the current generations, **no `Set-Cookie`**;
        - the outcome is still unknown → `503 operation_outcome_unknown`; retry with the same key only;
        - the original failed or was fenced → the same error code as the original, no `Set-Cookie`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [tenant_id]
              properties:
                tenant_id:
                  $ref: '#/components/schemas/Id'
            example: { tenant_id: SAMPLE-TENANT-A }
      responses:
        '200':
          description: Company chosen. Only the first response carries the new session cookie (rotated id); a retry does not.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SessionCookie'
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /company:
    get:
      tags: [company]
      operationId: getCompany
      summary: The current company (from the session context), with the caller's permissions in it
      description: |
        `my_permissions` lists the permission codes the caller's role holds in the current company, read live like every
        check (*approved* 2026-11-21). The interface uses it only to disable actions and say why; the server stays the
        judge and refuses with `permission_denied` whatever the interface shows.
      responses:
        '200':
          description: The current company and the caller's permissions in it
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyWithPermissionsResponse'
              examples:
                a:
                  $ref: '#/components/examples/CompanyAWithPermissions'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags: [company]
      operationId: updateCompany
      summary: Change the company's names or time zone; the base currency only until it is locked
      description: |
        Needs the permission `company.settings.write`. `base_currency_code` can change only while `currency_locked_at` is null
        (ADR-003); after that the request is refused with `currency_locked`. `country_code` is not changed here.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompanyUpdate'
            example: { display_name: SAMPLE Company A, timezone: Asia/Dubai }
      responses:
        '200':
          description: The company after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanyResponse'
              examples:
                a:
                  $ref: '#/components/examples/CompanyA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /members:
    get:
      tags: [members]
      operationId: listMembers
      summary: The memberships of the current company
      description: Needs `members.read`. Revoked memberships are listed with their status, so the history stays visible.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, revoked]
      responses:
        '200':
          description: The memberships (may be empty)
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [members, session]
                properties:
                  members:
                    type: array
                    items:
                      $ref: '#/components/schemas/Member'
                  session:
                    $ref: '#/components/schemas/SessionGenerations'
              examples:
                a:
                  value:
                    members:
                      - id: SAMPLE-MEMBERSHIP-1
                        user: { id: SAMPLE-USER-1, name: SAMPLE User 1, email: sample-user-1@example.invalid }
                        role: { id: SAMPLE-ROLE-OWNER-A, name: owner, is_system: true }
                        status: active
                        joined_at: '2026-11-01T08:00:00Z'
                        revoked_at: null
                      - id: SAMPLE-MEMBERSHIP-4
                        user: { id: SAMPLE-USER-4, name: SAMPLE User 4, email: sample-user-4@example.invalid }
                        role: { id: SAMPLE-ROLE-SITE-A, name: site_engineer, is_system: true }
                        status: revoked
                        joined_at: '2026-11-02T08:00:00Z'
                        revoked_at: '2026-11-20T10:30:00Z'
                    session: { generation: 2, context_generation: 1 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'

  /members/{membershipId}:
    parameters:
      - $ref: '#/components/parameters/MembershipId'
    patch:
      tags: [members]
      operationId: changeMemberRole
      summary: Give a member another system role
      description: |
        Needs `members.manage`. Refused with `last_owner` if it would leave the company without an active owner. The member's
        open sessions keep working, but every request is checked against the new role from the next request on (the role is
        read live, never from the session).
        Roles are rows of each company (`roles` has `tenant_id`, `UNIQUE(tenant_id, name)`, architecture document §6.3), so
        a system role has another id in every company. A `role_id` that is not a role of the current company, including a
        role of another company, → `404 not_found`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [role_id]
              properties:
                role_id:
                  $ref: '#/components/schemas/Id'
            example: { role_id: SAMPLE-ROLE-PM-A }
      responses:
        '200':
          description: The membership after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
    delete:
      tags: [members]
      operationId: revokeMember
      summary: Revoke a membership — effective immediately (S1 acceptance)
      description: |
        Needs `members.manage`. Effective from the member's next request: the membership is read live (§1.1), so any context
        of that member in this company stops working at once. Revoking an already revoked membership returns the same
        result. Refused with `last_owner` for the last active owner, and with `409 self_revocation_denied` when a member revokes
        their own membership here (*approved* 2026-11-21).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      responses:
        '200':
          description: The membership, now revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /roles:
    get:
      tags: [roles]
      operationId: listRoles
      summary: The system roles of the current company and their permissions
      description: Needs `members.read`. Only system roles exist at launch (D-API-1, approved 2026-11-21).
      responses:
        '200':
          description: The roles
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [roles, session]
                properties:
                  roles:
                    type: array
                    items:
                      $ref: '#/components/schemas/RoleWithPermissions'
                  session:
                    $ref: '#/components/schemas/SessionGenerations'
              examples:
                a:
                  value:
                    roles:
                      - id: SAMPLE-ROLE-OWNER-A
                        name: owner
                        is_system: true
                        permissions:
                          - { code: members.manage, zone: O, scope: company }
                          - { code: company.settings.write, zone: O, scope: company }
                      - id: SAMPLE-ROLE-SITE-A
                        name: site_engineer
                        is_system: true
                        permissions:
                          - { code: projects.read, zone: O, scope: assigned }
                    session: { generation: 2, context_generation: 1 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'

  /permissions:
    get:
      tags: [roles]
      operationId: listPermissions
      summary: The catalogue of permission codes (the same for every company)
      responses:
        '200':
          description: The permission catalogue
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [permissions, session]
                properties:
                  permissions:
                    type: array
                    items:
                      $ref: '#/components/schemas/Permission'
                  session:
                    $ref: '#/components/schemas/SessionGenerations'
              example:
                permissions:
                  - { code: members.manage, resource: members, action: manage, zone: O }
                  - { code: projects.read, resource: projects, action: read, zone: O }
                session: { generation: 2, context_generation: 1 }
        '401':
          $ref: '#/components/responses/Unauthenticated'

  /invitations:
    get:
      tags: [invitations]
      operationId: listInvitations
      summary: The invitations of the current company
      description: Needs `members.manage`. The invitation token is never returned, here or anywhere (stored as a hash only).
      responses:
        '200':
          description: The invitations
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [invitations, session]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Invitation'
                  session:
                    $ref: '#/components/schemas/SessionGenerations'
              examples:
                a:
                  value:
                    invitations:
                      - id: SAMPLE-INVITATION-1
                        email: sample-invitee-1@example.invalid
                        role: { id: SAMPLE-ROLE-PM-A, name: project_manager, is_system: true }
                        status: pending
                        invited_by: SAMPLE-USER-1
                        created_at: '2026-11-20T09:00:00Z'
                        expires_at: '2026-11-27T09:00:00Z'
                    session: { generation: 2, context_generation: 1 }
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [invitations]
      operationId: createInvitation
      summary: Invite someone to the current company with a system role
      description: |
        Needs `members.manage`. The token goes to the invitee by the notification channel (Q6) and never appears in a
        response. Refused with `already_member` for an active member's email, and with `invitation_pending` when a pending
        invitation for that email exists. An invitation is valid for **7 days** (*approved* 2026-11-21).
        Roles are rows of each company (`roles` has `tenant_id`, `UNIQUE(tenant_id, name)`, architecture document §6.3), so
        a system role has another id in every company. A `role_id` that is not a role of the current company, including a
        role of another company, → `404 not_found`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, role_id]
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
                role_id:
                  $ref: '#/components/schemas/Id'
            example: { email: sample-invitee-2@example.invalid, role_id: SAMPLE-ROLE-SITE-A }
      responses:
        '201':
          description: The invitation (without its token)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'
        '429':
          $ref: '#/components/responses/RateLimited'

  /invitations/{invitationId}:
    parameters:
      - name: invitationId
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Id'
    delete:
      tags: [invitations]
      operationId: revokeInvitation
      summary: Withdraw a pending invitation
      description: Needs `members.manage`. A withdrawn or accepted invitation returns its current state unchanged.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      responses:
        '200':
          description: The invitation, now withdrawn (or already accepted / expired)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invitations/accept:
    post:
      tags: [invitations]
      operationId: acceptInvitation
      summary: PLACEHOLDER — accept an invitation (needs the signed-in user, blocked by Q2)
      x-ambs-status: placeholder
      responses:
        '501':
          $ref: '#/components/responses/NotDefined'

  # ── S2 (DRAFT 1.2.0-draft, NOT APPROVED): clients and projects ───────────────────────────────────────────────────
  /clients:
    get:
      tags: [clients]
      operationId: listClients
      x-ambs-status: draft
      x-ambs-permission: party.client.read
      summary: Clients of the current company — parties with an active or archived `client` role (ADR-008)
      description: |
        Needs `party.client.read`. With the `assigned` scope, only the clients of the caller's assigned projects are listed.
        A party is one record per company (ADR-008 §5): a client of two companies is two unrelated records.
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of clients (may be empty)
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientListResponse'
              examples:
                a:
                  $ref: '#/components/examples/ClientListA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [clients]
      operationId: createClient
      x-ambs-status: draft
      x-ambs-permission: party.client.write
      summary: Create a party with the `client` role
      description: |
        Needs `party.client.write` (company scope). Creates the party and its `client` role in one operation. `party_code`
        is unique in the company → `409 code_taken` otherwise. Nothing in the body assumes a country: the tax registration
        number and the phone numbers are free of any national format (see `PartyContactInput`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCreate'
            example:
              party_code: SAMPLE-C-0002
              name_en: SAMPLE Client 2
              contacts: [{ contact_name: SAMPLE Contact 2, phone: '+15555550100', email: sample-contact-2@example.invalid, is_primary: true }]
      responses:
        '201':
          description: The client created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /clients/{partyId}:
    parameters:
      - $ref: '#/components/parameters/PartyId'
    get:
      tags: [clients]
      operationId: getClient
      x-ambs-status: draft
      x-ambs-permission: party.client.read
      summary: One client
      description: |
        Needs `party.client.read`. A party of another company, a party without the `client` role, one outside the caller's
        scope, and an unknown id all get the same `404 not_found`.
      responses:
        '200':
          description: The client
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
              examples:
                a:
                  $ref: '#/components/examples/ClientA1'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags: [clients]
      operationId: updateClient
      x-ambs-status: draft
      x-ambs-permission: party.client.write
      summary: Change a client's names, tax registration number or contacts
      description: |
        Needs `party.client.write` (company scope). `contacts`, when sent, replaces the list. `party_code` does not change
        here. An archived client is read-only → `409 client_archived`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientUpdate'
            example: { name_ar: عميل تجريبي 1, tax_registration_no: SAMPLE-TAX-0001 }
      responses:
        '200':
          description: The client after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /clients/{partyId}/archive:
    parameters:
      - $ref: '#/components/parameters/PartyId'
    post:
      tags: [clients]
      operationId: archiveClient
      x-ambs-status: draft
      x-ambs-permission: party.client.write
      summary: Archive a client — never delete
      description: |
        Needs `party.client.write` (company scope). The record stays, with its history; it leaves the default list
        (`status=active`). Archiving an archived client returns it unchanged. What archiving does to the party's other
        roles and to its open projects is an open question of this draft (S2-design O-4, O-5).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      responses:
        '200':
          description: The client, archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /projects:
    get:
      tags: [projects]
      operationId: listProjects
      x-ambs-status: draft
      x-ambs-permission: project.read
      summary: Projects of the current company the caller may see
      description: |
        Needs `project.read`. With the `assigned` scope, only projects with an active assignment of the caller's membership
        are listed (`project_assignments`, matrix layer 2): a site engineer never sees a project they are not assigned to.
        A project carries no amount and no contract (`projects` holds no financial column; contracts come after launch, Q1).
      parameters:
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/StatusFilter'
        - name: client_party_id
          in: query
          required: false
          description: Only the projects of this client. A client the caller cannot see gives an empty page, not an error.
          schema:
            $ref: '#/components/schemas/Id'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of projects (may be empty)
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
              examples:
                a:
                  $ref: '#/components/examples/ProjectListA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [projects]
      operationId: createProject
      x-ambs-status: draft
      x-ambs-permission: project.write
      summary: Create a project for one client
      description: |
        Needs `project.write` (company scope). `client_party_id` must be a party of the current company with the `client`
        role → otherwise `404 not_found` (another company's party, a party without that role and an unknown id answer the
        same). An archived client gets no new project → `409 client_archived`. `project_code` is unique in the company →
        `409 code_taken`. Two projects of one client stay two projects; nothing merges them (S2 acceptance).
        `currency_code` is required and has no default: the contract assumes no country (ISO 4217, an active currency of
        the `currencies` reference, else `400 invalid_request`). `start_date <= end_date` when both are set.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
            example:
              project_code: SAMPLE-P-B-0002
              client_party_id: SAMPLE-PARTY-B-1
              name: SAMPLE Project B2
              start_date: '2026-12-01'
              currency_code: SAR
      responses:
        '201':
          description: The project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
              examples:
                b:
                  $ref: '#/components/examples/ProjectB1'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [projects]
      operationId: getProject
      x-ambs-status: draft
      x-ambs-permission: project.read
      summary: One project
      description: |
        Needs `project.read`. A project of another company, one outside the caller's assignments, and an unknown id all get
        the same `404 not_found`.
      responses:
        '200':
          description: The project
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags: [projects]
      operationId: updateProject
      x-ambs-status: draft
      x-ambs-permission: project.write
      summary: Change a project's name or dates
      description: |
        Needs `project.write`; with the `assigned` scope only for an assigned project. The client, the code and the currency
        do not change here (S2-design O-7). An archived project is read-only → `409 project_archived`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
            example: { name: SAMPLE Project A1 (phase 2), end_date: '2027-06-30' }
      responses:
        '200':
          description: The project after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /projects/{projectId}/archive:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      tags: [projects]
      operationId: archiveProject
      x-ambs-status: draft
      x-ambs-permission: project.write
      summary: Archive a project — never delete
      description: |
        Needs `project.write` with the company scope (an assigned-scope grant does not archive). The record stays with its
        history. Archiving an archived project returns it unchanged.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      responses:
        '200':
          description: The project, archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ambs_session
      description: |
        Opaque session id (§4.2): `Secure; HttpOnly; Path=/; SameSite=Lax`, no `Domain`. Name *approved* 2026-11-21. The
        cookie never holds an AMBS context token or an identity field.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        One key per user action (§4.8). The operation log is scoped to the user and kept for 24 hours (*approved*
        2026-11-21). Its fingerprint is the method, the path, the body and the value of `X-AMBS-Context-Generation` sent.
        The log is read **before** the context generation is compared, so retrying a company choice whose response was
        lost gets the stored result. The same key with another fingerprint (another request, or the same request from
        another context) → `422 idempotency_key_reused`. A replay returns the stored result only, never a stored cookie.
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: SAMPLE-IDEMPOTENCY-0001-abcdef
    ContextGeneration:
      name: X-AMBS-Context-Generation
      in: header
      required: true
      description: |
        The `context_generation` the page last received in a response's `session` block (§4.3, §4.6). Not a tenant id and
        not a credential: it grants nothing. Missing or malformed → `400 context_generation_required`; a valid value
        different from the session's current one → `409 tenant_changed`. Nothing is done in either case.
      schema:
        type: integer
        minimum: 0
      example: 1
    # S2 (draft)
    PartyId:
      name: partyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SearchQuery:
      name: q
      in: query
      required: false
      description: Text searched in the codes and names (Arabic and English), case-insensitive. No search syntax.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, archived, all]
        default: active
    Page:
      name: page
      in: query
      required: false
      description: Page number, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'

  headers:
    PrivateNoStore:
      description: Private response, never stored by a shared cache (§4.7)
      schema:
        type: string
        const: private, no-store
    SessionCookie:
      description: The rotated session id (§4.9). Appears only in the first response of the operation that issued it.
      schema:
        type: string

  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 64
      description: Opaque identifier (a UUID in the backend). Clients never parse it.
      examples: [SAMPLE-TENANT-A]
    Timestamp:
      type: string
      format: date-time
    SessionGenerations:
      type: object
      additionalProperties: false
      required: [generation, context_generation]
      description: Carried by every response, success or error (§3.3, §4.6). Never contains the session id.
      properties:
        generation:
          type: integer
          minimum: 0
        context_generation:
          type: integer
          minimum: 0
    RoleRef:
      type: object
      additionalProperties: false
      required: [id, name, is_system]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 64
        is_system:
          type: boolean
    Company:
      type: object
      additionalProperties: false
      required: [id, slug, legal_name, display_name, country_code, base_currency_code, currency_locked_at, timezone, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        legal_name:
          type: string
          maxLength: 200
        display_name:
          type: string
          maxLength: 120
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2. Set at creation; not changed by `PATCH /company`.
        base_currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217. Locked once `currency_locked_at` is set (ADR-003).
        currency_locked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        timezone:
          type: string
          description: IANA time zone name
        status:
          type: string
          enum: [trialing, active, suspended, ended]
          description: Mirrors the subscription state; the subscription contract itself waits for Q4.
    CompanyResponse:
      type: object
      additionalProperties: false
      required: [company, session]
      properties:
        company:
          $ref: '#/components/schemas/Company'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    CompanyWithPermissionsResponse:
      type: object
      additionalProperties: false
      required: [company, my_permissions, session]
      properties:
        company:
          $ref: '#/components/schemas/Company'
        my_permissions:
          type: array
          description: Permission codes of the caller's role in the current company (`permissions.code`)
          uniqueItems: true
          items:
            type: string
            pattern: '^[a-z_]+(\.[a-z_]+)+$'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    CompanyUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        legal_name:
          type: string
          maxLength: 200
        display_name:
          type: string
          maxLength: 120
        timezone:
          type: string
        base_currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
    MyMembership:
      type: object
      additionalProperties: false
      required: [tenant_id, display_name, role]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Id'
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/RoleRef'
    Member:
      type: object
      additionalProperties: false
      required: [id, user, role, status, joined_at, revoked_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        user:
          type: object
          additionalProperties: false
          required: [id, name, email]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
            email:
              type: string
              format: email
        role:
          $ref: '#/components/schemas/RoleRef'
        status:
          type: string
          enum: [active, revoked]
        joined_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MemberResponse:
      type: object
      additionalProperties: false
      required: [member, session]
      properties:
        member:
          $ref: '#/components/schemas/Member'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    Permission:
      type: object
      additionalProperties: false
      required: [code, resource, action, zone]
      properties:
        code:
          type: string
        resource:
          type: string
        action:
          type: string
        zone:
          $ref: '#/components/schemas/Zone'
    Zone:
      type: string
      enum: [O, F1, F2, P]
      description: ADR-009 zones.
    Grant:
      type: object
      additionalProperties: false
      required: [code, zone, scope]
      properties:
        code:
          type: string
        zone:
          $ref: '#/components/schemas/Zone'
        scope:
          type: string
          enum: [company, assigned]
          description: '`assigned` limits the grant to the projects the member is assigned to (ADR-005).'
    RoleWithPermissions:
      type: object
      additionalProperties: false
      required: [id, name, is_system, permissions]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 64
        is_system:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, status, invited_by, created_at, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleRef'
        status:
          type: string
          enum: [pending, accepted, expired, withdrawn]
        invited_by:
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: created_at + 7 days (approved 2026-11-21)
    InvitationResponse:
      type: object
      additionalProperties: false
      required: [invitation, session]
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    ErrorCode:
      type: string
      description: |
        The contract (§3.3); `message` is for display only and carries no logic. `code_taken`, `client_archived` and
        `project_archived` are S2 codes proposed in the 1.2.0 draft, not approved.
      enum:
        # §3.3
        - unauthenticated
        - session_expired
        - context_required
        - context_ended
        - membership_revoked
        - tenant_selection_denied
        - permission_denied
        - not_found
        - tenant_changed
        - invalid_request
        - rate_limited
        - service_unavailable
        - operation_outcome_unknown
        - operation_aborted
        - operation_in_progress
        - idempotency_key_reused
        - session_rotated
        - context_generation_required
        # S1 codes, approved by the owner 2026-11-21. role_in_use and system_role_immutable are reserved for custom roles
        # after launch (D-API-1); no path at launch returns them.
        - last_owner
        - already_member
        - invitation_pending
        - role_in_use
        - system_role_immutable
        - currency_locked
        - self_revocation_denied
        - code_taken
        - client_archived
        - project_archived
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        request_id:
          type: string
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error, session]
      description: The error envelope of §3.3, with the generations the request was computed under.
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    UnauthenticatedBody:
      type: object
      additionalProperties: false
      required: [error]
      description: The only error body without generations, because there is no valid session (401) or no shape yet (501).
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    # ── S2 (DRAFT 1.2.0-draft). Fields follow the backend architecture document §6.4 and §6.5 word for word ─────────
    PageInfo:
      type: object
      additionalProperties: false
      required: [number, size, item_count]
      properties:
        number:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        item_count:
          type: integer
          minimum: 0
          description: Items visible to the caller with this filter, not items in the company. A count, never money.
    PartyRole:
      type: object
      additionalProperties: false
      required: [role, is_active]
      description: A row of `party_roles` (ADR-008). One party can hold several roles without duplicating its data.
      properties:
        role:
          type: string
          enum: [client, supplier, main_contractor, subcontractor, consultant, other]
        is_active:
          type: boolean
    PartyContact:
      type: object
      additionalProperties: false
      required: [id, contact_name, phone, email, is_primary]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        contact_name:
          type: string
        phone:
          type: [string, 'null']
          description: International format (E.164, `+` and the country calling code). No country is assumed.
        email:
          type: [string, 'null']
          format: email
        is_primary:
          type: boolean
    PartyContactInput:
      type: object
      additionalProperties: false
      required: [contact_name]
      properties:
        contact_name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: E.164. The calling code is part of the number; no national format is applied.
        email:
          type: [string, 'null']
          format: email
        is_primary:
          type: boolean
          default: false
    Client:
      type: object
      additionalProperties: false
      required: [id, party_code, name_ar, name_en, tax_registration_no, status, roles, contacts, created_at, updated_at]
      description: A party seen through its `client` role (`parties` + `party_roles` + `party_contacts`, §6.4).
      properties:
        id:
          $ref: '#/components/schemas/Id'
        party_code:
          type: string
        name_ar:
          type: [string, 'null']
        name_en:
          type: [string, 'null']
        tax_registration_no:
          type: [string, 'null']
          description: As registered, with no national format check (the party has no country field yet, S2-design D-1).
        status:
          type: string
          enum: [active, archived]
        roles:
          type: array
          items:
            $ref: '#/components/schemas/PartyRole'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/PartyContact'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClientCreate:
      type: object
      additionalProperties: false
      required: [party_code]
      anyOf:
        - required: [name_ar]
        - required: [name_en]
      properties:
        party_code:
          type: string
          minLength: 1
          maxLength: 50
        name_ar:
          type: string
          minLength: 1
          maxLength: 200
        name_en:
          type: string
          minLength: 1
          maxLength: 200
        tax_registration_no:
          type: string
          minLength: 1
          maxLength: 50
        contacts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PartyContactInput'
    ClientUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name_ar:
          type: [string, 'null']
          maxLength: 200
        name_en:
          type: [string, 'null']
          maxLength: 200
        tax_registration_no:
          type: [string, 'null']
          maxLength: 50
        contacts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PartyContactInput'
    ClientResponse:
      type: object
      additionalProperties: false
      required: [client, session]
      properties:
        client:
          $ref: '#/components/schemas/Client'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    ClientListResponse:
      type: object
      additionalProperties: false
      required: [clients, page, session]
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        page:
          $ref: '#/components/schemas/PageInfo'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    Project:
      type: object
      additionalProperties: false
      required: [id, project_code, client_party_id, name, status, start_date, end_date, currency_code, legacy_type_label, created_at, updated_at]
      description: |
        A row of `projects` (§6.5). No financial column, no contract, no amount. Only the client's id: the client's name
        is read through `party.client.read`, which a site engineer does not hold.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        project_code:
          type: string
        client_party_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217, from the `currencies` reference. No default currency is assumed.
        legacy_type_label:
          type: [string, 'null']
          description: Read-only trace of the old `projects.type` (§3.2); never used to classify.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [project_code, client_party_id, name, currency_code]
      properties:
        project_code:
          type: string
          minLength: 1
          maxLength: 50
        client_party_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 200
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [project, session]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [projects, page, session]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page:
          $ref: '#/components/schemas/PageInfo'
        session:
          $ref: '#/components/schemas/SessionGenerations'

  responses:
    NotDefined:
      description: Placeholder — not defined until its blocking decision is made
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedBody'
    Unauthenticated:
      description: No valid session, so no generations. Never carries Set-Cookie (§4.2, r9).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedBody'
          example: { error: { code: unauthenticated, message: Your session in this browser has ended } }
    Forbidden:
      description: '`permission_denied`, `membership_revoked` or `tenant_selection_denied`. The session stays.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: permission_denied, message: You do not have permission for this action }
            session: { generation: 2, context_generation: 1 }
    NotFound:
      description: Not found or not visible to this user in this company (no hint which)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: not_found, message: Item not found }
            session: { generation: 2, context_generation: 1 }
    Conflict:
      description: |
        `tenant_changed` (a stale `X-AMBS-Context-Generation`), `context_required`, `context_ended`,
        `session_rotated`, `operation_in_progress`, or an S1 rule code (`last_owner`, `self_revocation_denied`,
        `already_member`, `invitation_pending`, `currency_locked`), or an S2 rule code proposed in the 1.2.0 draft
        (`code_taken`, `client_archived`, `project_archived`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: tenant_changed, message: The company changed in another tab }
            session: { generation: 3, context_generation: 2 }
    BadRequest:
      description: |
        `invalid_request` (invalid input), or `context_generation_required` (the `X-AMBS-Context-Generation` header is
        missing or malformed: a fault in the page, shown as an error and never answered by reloading)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: context_generation_required, message: The request could not be sent completely }
            session: { generation: 2, context_generation: 1 }
    IdempotencyKeyReused:
      description: The same Idempotency-Key with another fingerprint (method, path, body or sent X-AMBS-Context-Generation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: idempotency_key_reused, message: The request could not be accepted }
            session: { generation: 2, context_generation: 1 }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: rate_limited, message: Too many attempts in a short time }
            session: { generation: 2, context_generation: 1 }
    Unavailable:
      description: '`service_unavailable` or `operation_outcome_unknown` (repeat with the same Idempotency-Key only)'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: operation_outcome_unknown, message: We could not confirm the result }
            session: { generation: 2, context_generation: 1 }

