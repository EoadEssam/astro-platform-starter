        company; with `assigned`, only the expenses of the projects with an assignment of the caller's membership. An
        expense outside the scope is never listed, and reading it by id is `404 not_found`. `item_count` counts the visible
        expenses only. Amounts are never summed across currencies here (ADR-003 §9): each expense carries its own currency.
        **Subscription (backend C15, a candidate, not runtime-validated):** while the company's subscription is expired,
        expenses stay readable and every change is refused with `403 subscription_read_only`; while it is suspended,
        expenses are hidden (the list is empty, an id is `404 not_found`) and every change is refused the same way. This
        contract describes C15 and changes nothing in it (C15, C16 are not touched).
      parameters:
        - name: project_id
          in: query
          required: false
          description: Only this project's expenses. A project the caller cannot see gives an empty page, not an error.
          schema:
            $ref: '#/components/schemas/Id'
        - name: approval_status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ExpenseApprovalStatus'
        - name: settlement_status
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/ExpenseSettlementStatus'
        - name: category_id
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/Id'
        - name: incurred_from
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: incurred_to
          in: query
          required: false
          schema:
            type: string
            format: date
        - $ref: '#/components/parameters/SearchQuery'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: One page of expenses (may be empty)
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseListResponse'
              examples:
                a:
                  $ref: '#/components/examples/ExpenseListA'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    post:
      tags: [expenses]
      operationId: createExpense
      x-ambs-status: draft
      x-ambs-permission: expense.write
      summary: Record an expense of a project, as a draft
      description: |
        Needs `expense.write`. **Filtered on the server by the scope of the grant**: `project_id` must be a project the
        caller may write expenses for; a project of another company, outside the scope, or unknown is `404 not_found`. An
        archived project takes no new expense → `409 project_archived`.
        **Money:** `amount` and `tax_amount` are decimal text, never a number, with no more decimals than the currency's
        `decimals` (`currencies`, ADR-003), else `400 invalid_request`; nothing is rounded. `currency_code` is required and
        has no default: it must be the project's currency → otherwise `409 currency_mismatch` (no currency conversion at
        launch). `tax_amount` is the tax the user enters, if any; no rate is assumed or computed here.
        `category_id` must be an active category of the company (`404` / `409 category_inactive`). `supplier_party_id`,
        when set, must be a party of the company with the `supplier` role (`404`) that is active (`409 supplier_inactive`,
        ADR-008: the role is never added automatically). The expense starts as `draft`, `unpaid`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCreate'
            example:
              project_id: SAMPLE-PROJECT-A-1
              category_id: SAMPLE-EXPCAT-A-1
              supplier_party_id: SAMPLE-PARTY-A-1
              amount: '1250.00'
              tax_amount: '87.50'
              currency_code: AED
              incurred_on: '2026-11-18'
              description: SAMPLE cement delivery
      responses:
        '201':
          description: The expense created, as a draft
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /expenses/{expenseId}:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    get:
      tags: [expenses]
      operationId: getExpense
      x-ambs-status: draft
      x-ambs-permission: expense.read
      summary: One expense
      description: |
        Needs `expense.read`. **Filtered on the server by the scope of the grant**: an expense of another company, one
        outside the caller's scope (its project not assigned, with the `assigned` scope), and an unknown id all get
        the same `404 not_found`.
      responses:
        '200':
          description: The expense
          headers:
            Cache-Control:
              $ref: '#/components/headers/PrivateNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
              examples:
                a:
                  $ref: '#/components/examples/ExpenseA1'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    patch:
      tags: [expenses]
      operationId: updateExpense
      x-ambs-status: draft
      x-ambs-permission: expense.write
      summary: Change a draft or rejected expense
      description: |
        Needs `expense.write`. **Filtered on the server by the scope of the grant**: outside it is `404 not_found`. Only
        a `draft` or `rejected` expense changes; any other → `409 expense_not_editable` (an approved expense is never
        edited or deleted). The money rules of `createExpense` apply; `currency_code` must come with `amount` or
        `tax_amount`. The project does not change here.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseUpdate'
            example: { amount: '1300.00', currency_code: AED, description: SAMPLE cement delivery (corrected) }
      responses:
        '200':
          description: The expense after the change
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /expenses/{expenseId}/submit:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [expenses]
      operationId: submitExpense
      x-ambs-status: draft
      x-ambs-permission: expense.write
      summary: Submit a draft or rejected expense for approval
      description: |
        Needs `expense.write`. **Filtered on the server by the scope of the grant**: outside it is `404 not_found`.
        Moves `draft` or `rejected` to `submitted`; any other state → `409 invalid_transition`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      responses:
        '200':
          description: The expense after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /expenses/{expenseId}/approve:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [expenses]
      operationId: approveExpense
      x-ambs-status: draft
      x-ambs-permission: expense.approve
      summary: Approve a submitted expense
      description: |
        Needs `expense.approve`. **Filtered on the server by the scope of the grant**: outside it is `404 not_found`.
        Moves `submitted` to `approved`; any other state → `409 invalid_transition`. Approved is not paid: `settlement_status`
        stays as it is (ERD: "approved is NOT paid").
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      responses:
        '200':
          description: The expense after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /expenses/{expenseId}/reject:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [expenses]
      operationId: rejectExpense
      x-ambs-status: draft
      x-ambs-permission: expense.approve
      summary: Reject a submitted expense, with a reason
      description: |
        Needs `expense.approve`. **Filtered on the server by the scope of the grant**: outside it is `404 not_found`.
        Moves `submitted` to `rejected` (the author may change it and submit again); any other state → `409 invalid_transition`.
        `reason` is required.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseReason'
            example: { reason: SAMPLE reason }
      responses:
        '200':
          description: The expense after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /expenses/{expenseId}/cancel:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [expenses]
      operationId: cancelExpense
      x-ambs-status: draft
      x-ambs-permission: expense.write
      summary: Cancel an expense that is not approved
      description: |
        Needs `expense.write`. **Filtered on the server by the scope of the grant**: outside it is `404 not_found`.
        Moves `draft`, `submitted` or `rejected` to `cancelled` (final; the record stays). An approved expense is not
        cancelled → `409 invalid_transition` (see `void`).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseReason'
            example: { reason: SAMPLE reason }
      responses:
        '200':
          description: The expense after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /expenses/{expenseId}/void:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [expenses]
      operationId: voidExpense
      x-ambs-status: draft
      x-ambs-permission: expense.approve
      summary: Void an approved, unpaid expense, with a reason — never delete
      description: |
        Needs `expense.approve`. **Filtered on the server by the scope of the grant**: outside it is `404 not_found`.
        Moves `approved` to `voided` (final; the record stays, with its reason, for audit). Financial deletion is not
        allowed (§6.8: "البديل إلغاء/عكس بأثر تدقيقي"); the correction is a void and, if needed, a new expense. An expense
        with any payment → `409 expense_paid` (S3-design O-5). Any other state → `409 invalid_transition`.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseReason'
            example: { reason: SAMPLE reason }
      responses:
        '200':
          description: The expense after the transition
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

  /expenses/{expenseId}/payments:
    parameters:
      - $ref: '#/components/parameters/ExpenseId'
    post:
      tags: [expenses]
      operationId: recordExpensePayment
      x-ambs-status: draft
      x-ambs-permission: expense.pay
      summary: Record a payment of an approved expense (L3, cash out)
      description: |
        Needs `expense.pay`. **Filtered on the server by the scope of the grant**: outside it is `404 not_found`. Only an
        `approved` expense is paid → otherwise `409 invalid_transition`. `amount` is decimal text in the expense's
        currency (`currency_code` required, equal to the expense's → `409 currency_mismatch`; no conversion). The payments
        so far plus this one may not exceed `amount + tax_amount` → `409 overpayment`, checked inside one transaction.
        The expense's `paid_amount` grows by it, `paid_on` becomes this payment's date, and `settlement_status` follows:
        `partially_paid`, then `paid` when the total is reached. A retry with the same `Idempotency-Key` records nothing
        twice (§4.8; ADR-012: every financial write carries an idempotency key).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/ContextGeneration'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpensePayment'
            example: { amount: '500.00', currency_code: AED, paid_on: '2026-11-20' }
      responses:
        '200':
          description: The expense with the payment counted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/IdempotencyKeyReused'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-ambs_session
      description: |
        Opaque session id (§4.2): `Secure; HttpOnly; Path=/; SameSite=Lax`, no `Domain`. Name *approved* 2026-11-21. The
        cookie never holds an AMBS context token or an identity field.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        One key per user action (§4.8). The operation log is scoped to the user and kept for 24 hours (*approved*
        2026-11-21). Its fingerprint is the method, the path, the body and the value of `X-AMBS-Context-Generation` sent.
        The log is read **before** the context generation is compared, so retrying a company choice whose response was
        lost gets the stored result. The same key with another fingerprint (another request, or the same request from
        another context) → `422 idempotency_key_reused`. A replay returns the stored result only, never a stored cookie.
      schema:
        type: string
        minLength: 16
        maxLength: 128
      example: SAMPLE-IDEMPOTENCY-0001-abcdef
    ContextGeneration:
      name: X-AMBS-Context-Generation
      in: header
      required: true
      description: |
        The `context_generation` the page last received in a response's `session` block (§4.3, §4.6). Not a tenant id and
        not a credential: it grants nothing. Missing or malformed → `400 context_generation_required`; a valid value
        different from the session's current one → `409 tenant_changed`. Nothing is done in either case.
      schema:
        type: integer
        minimum: 0
      example: 1
    # S2 (1.2.0)
    PartyId:
      name: partyId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ProjectId:
      name: projectId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    SearchQuery:
      name: q
      in: query
      required: false
      description: |
        Text searched in the codes and names (Arabic and English), as a part of the text, case-insensitive, with a simple
        Arabic normalisation on the server: أ إ آ → ا, ة → ه, ى → ي, diacritics ignored (*approved* 2026-11-21, O-10).
        No search syntax.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [active, archived, all]
        default: active
    Page:
      name: page
      in: query
      required: false
      description: Page number, from 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    # S3 (draft)
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    ExpenseId:
      name: expenseId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'

  headers:
    PrivateNoStore:
      description: Private response, never stored by a shared cache (§4.7)
      schema:
        type: string
        const: private, no-store
    SessionCookie:
      description: The rotated session id (§4.9). Appears only in the first response of the operation that issued it.
      schema:
        type: string

  schemas:
    Id:
      type: string
      minLength: 1
      maxLength: 64
      description: Opaque identifier (a UUID in the backend). Clients never parse it.
      examples: [SAMPLE-TENANT-A]
    Timestamp:
      type: string
      format: date-time
    SessionGenerations:
      type: object
      additionalProperties: false
      required: [generation, context_generation]
      description: Carried by every response, success or error (§3.3, §4.6). Never contains the session id.
      properties:
        generation:
          type: integer
          minimum: 0
        context_generation:
          type: integer
          minimum: 0
    RoleRef:
      type: object
      additionalProperties: false
      required: [id, name, is_system]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 64
        is_system:
          type: boolean
    Company:
      type: object
      additionalProperties: false
      required: [id, slug, legal_name, display_name, country_code, base_currency_code, currency_locked_at, timezone, status]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        slug:
          type: string
          pattern: '^[a-z0-9][a-z0-9-]{1,62}$'
        legal_name:
          type: string
          maxLength: 200
        display_name:
          type: string
          maxLength: 120
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
          description: ISO 3166-1 alpha-2. Set at creation; not changed by `PATCH /company`.
        base_currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217. Locked once `currency_locked_at` is set (ADR-003).
        currency_locked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
        timezone:
          type: string
          description: IANA time zone name
        status:
          type: string
          enum: [trialing, active, suspended, ended]
          description: Mirrors the subscription state; the subscription contract itself waits for Q4.
    CompanyResponse:
      type: object
      additionalProperties: false
      required: [company, session]
      properties:
        company:
          $ref: '#/components/schemas/Company'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    CompanyWithPermissionsResponse:
      type: object
      additionalProperties: false
      required: [company, my_permissions, session]
      properties:
        company:
          $ref: '#/components/schemas/Company'
        my_permissions:
          type: array
          description: |
            The caller's permissions in the current company, one item per permission code with the widest scope held.
            PROPOSED shape in 1.3.0-draft (was: the codes alone, 1.2.0).
          uniqueItems: true
          items:
            $ref: '#/components/schemas/MyGrant'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    MyGrant:
      type: object
      additionalProperties: false
      required: [code, scope]
      description: PROPOSED in 1.3.0-draft. A permission of the caller and the scope it is held with.
      properties:
        code:
          type: string
          pattern: '^[a-z_]+(\.[a-z_]+)+$'
          description: '`permissions.code`'
        scope:
          type: string
          enum: [company, assigned]
          description: As `Grant.scope` (company → `tenant`, assigned → `project` in the backend, D-12).
    CompanyUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        legal_name:
          type: string
          maxLength: 200
        display_name:
          type: string
          maxLength: 120
        timezone:
          type: string
        base_currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
    MyMembership:
      type: object
      additionalProperties: false
      required: [tenant_id, display_name, role]
      properties:
        tenant_id:
          $ref: '#/components/schemas/Id'
        display_name:
          type: string
        role:
          $ref: '#/components/schemas/RoleRef'
    Member:
      type: object
      additionalProperties: false
      required: [id, user, role, status, joined_at, revoked_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        user:
          type: object
          additionalProperties: false
          required: [id, name, email]
          properties:
            id:
              $ref: '#/components/schemas/Id'
            name:
              type: string
            email:
              type: string
              format: email
        role:
          $ref: '#/components/schemas/RoleRef'
        status:
          type: string
          enum: [active, revoked]
        joined_at:
          $ref: '#/components/schemas/Timestamp'
        revoked_at:
          oneOf:
            - $ref: '#/components/schemas/Timestamp'
            - type: 'null'
    MemberResponse:
      type: object
      additionalProperties: false
      required: [member, session]
      properties:
        member:
          $ref: '#/components/schemas/Member'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    Permission:
      type: object
      additionalProperties: false
      required: [code, resource, action, zone]
      properties:
        code:
          type: string
        resource:
          type: string
        action:
          type: string
        zone:
          $ref: '#/components/schemas/Zone'
    Zone:
      type: string
      enum: [O, F1, F2, P]
      description: ADR-009 zones.
    Grant:
      type: object
      additionalProperties: false
      required: [code, zone, scope]
      properties:
        code:
          type: string
        zone:
          $ref: '#/components/schemas/Zone'
        scope:
          type: string
          enum: [company, assigned]
          description: '`assigned` limits the grant to the projects the member is assigned to (ADR-005).'
    RoleWithPermissions:
      type: object
      additionalProperties: false
      required: [id, name, is_system, permissions]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          maxLength: 64
        is_system:
          type: boolean
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/Grant'
    Invitation:
      type: object
      additionalProperties: false
      required: [id, email, role, status, invited_by, created_at, expires_at]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/RoleRef'
        status:
          type: string
          enum: [pending, accepted, expired, withdrawn]
        invited_by:
          $ref: '#/components/schemas/Id'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        expires_at:
          $ref: '#/components/schemas/Timestamp'
          description: created_at + 7 days (approved 2026-11-21)
    InvitationResponse:
      type: object
      additionalProperties: false
      required: [invitation, session]
      properties:
        invitation:
          $ref: '#/components/schemas/Invitation'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    ErrorCode:
      type: string
      description: |
        The contract (§3.3); `message` is for display only and carries no logic. The S2 codes `code_taken`,
        `client_archived`, `project_archived` and `already_assigned` are *approved* (2026-11-21, O-1, O-5, O-12). The S3 codes
        after them are PROPOSED in 1.3.0-draft, not approved.
      enum:
        # §3.3
        - unauthenticated
        - session_expired
        - context_required
        - context_ended
        - membership_revoked
        - tenant_selection_denied
        - permission_denied
        - not_found
        - tenant_changed
        - invalid_request
        - rate_limited
        - service_unavailable
        - operation_outcome_unknown
        - operation_aborted
        - operation_in_progress
        - idempotency_key_reused
        - session_rotated
        - context_generation_required
        # S1 codes, approved by the owner 2026-11-21. role_in_use and system_role_immutable are reserved for custom roles
        # after launch (D-API-1); no path at launch returns them.
        - last_owner
        - already_member
        - invitation_pending
        - role_in_use
        - system_role_immutable
        - currency_locked
        - self_revocation_denied
        - code_taken
        - client_archived
        - project_archived
        - already_assigned
        # S3 (1.3.0-draft, PROPOSED)
        - expense_not_editable
        - invalid_transition
        - overpayment
        - currency_mismatch
        - category_inactive
        - supplier_inactive
        - expense_paid
        - subscription_read_only
    ErrorDetail:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
        request_id:
          type: string
    ErrorBody:
      type: object
      additionalProperties: false
      required: [error, session]
      description: The error envelope of §3.3, with the generations the request was computed under.
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    UnauthenticatedBody:
      type: object
      additionalProperties: false
      required: [error]
      description: The only error body without generations, because there is no valid session (401) or no shape yet (501).
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    # ── S2 (1.2.0). Fields follow the backend architecture document §6.4 and §6.5 word for word ──
    PageInfo:
      type: object
      additionalProperties: false
      required: [number, size, item_count]
      properties:
        number:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
          maximum: 100
        item_count:
          type: integer
          minimum: 0
          description: Items visible to the caller with this filter, not items in the company. A count, never money.
    PartyRole:
      type: object
      additionalProperties: false
      required: [role, is_active]
      description: A row of `party_roles` (ADR-008). One party can hold several roles without duplicating its data.
      properties:
        role:
          type: string
          enum: [client, supplier, main_contractor, subcontractor, consultant, other]
        is_active:
          type: boolean
    PartyContact:
      type: object
      additionalProperties: false
      required: [id, contact_name, phone, email, is_primary]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        contact_name:
          type: string
        phone:
          type: [string, 'null']
          description: International format (E.164, `+` and the country calling code). No country is assumed.
        email:
          type: [string, 'null']
          format: email
        is_primary:
          type: boolean
    PartyContactInput:
      type: object
      additionalProperties: false
      required: [contact_name]
      properties:
        contact_name:
          type: string
          minLength: 1
          maxLength: 200
        phone:
          type: [string, 'null']
          pattern: '^\+[1-9][0-9]{6,14}$'
          description: E.164. The calling code is part of the number; no national format is applied.
        email:
          type: [string, 'null']
          format: email
        is_primary:
          type: boolean
          default: false
    Client:
      type: object
      additionalProperties: false
      required: [id, party_code, name_ar, name_en, country_code, tax_registration_no, status, roles, contacts, created_at, updated_at]
      description: |
        A party seen through its `client` role (`parties` + `party_roles` + `party_contacts`, §6.4). `status` is the
        state of the `client` role only (*approved* 2026-11-21, O-4); archived is `party_roles.is_active = false` in the backend,
        with no `status` column (*approved* 2026-11-21, D-11).
      properties:
        id:
          $ref: '#/components/schemas/Id'
        party_code:
          type: string
        name_ar:
          type: [string, 'null']
        name_en:
          type: [string, 'null']
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
          description: |
            ISO 3166-1 alpha-2, the party's country (*approved* 2026-11-21, D-1). Needs a new backend migration adding the
            column to `parties` (docs/after-launch.md, backend items).
        tax_registration_no:
          type: [string, 'null']
          description: As registered, read in the terms of the party's `country_code`; no national format check here.
        status:
          type: string
          enum: [active, archived]
        roles:
          type: array
          items:
            $ref: '#/components/schemas/PartyRole'
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/PartyContact'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ClientCreate:
      type: object
      additionalProperties: false
      required: [country_code]
      anyOf:
        - required: [name_ar]
        - required: [name_en]
      properties:
        party_code:
          type: string
          maxLength: 50
          description: Optional. Left out or empty, the server generates it (*approved* 2026-11-21, O-1).
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
        name_ar:
          type: string
          minLength: 1
          maxLength: 200
        name_en:
          type: string
          minLength: 1
          maxLength: 200
        tax_registration_no:
          type: string
          minLength: 1
          maxLength: 50
        contacts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PartyContactInput'
    ClientUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        country_code:
          type: string
          pattern: '^[A-Z]{2}$'
        name_ar:
          type: [string, 'null']
          maxLength: 200
        name_en:
          type: [string, 'null']
          maxLength: 200
        tax_registration_no:
          type: [string, 'null']
          maxLength: 50
        contacts:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/PartyContactInput'
    ClientResponse:
      type: object
      additionalProperties: false
      required: [client, session]
      properties:
        client:
          $ref: '#/components/schemas/Client'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    ClientListResponse:
      type: object
      additionalProperties: false
      required: [clients, page, session]
      properties:
        clients:
          type: array
          items:
            $ref: '#/components/schemas/Client'
        page:
          $ref: '#/components/schemas/PageInfo'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    Project:
      type: object
      additionalProperties: false
      required: [id, project_code, client_party_id, name, status, start_date, end_date, currency_code, legacy_type_label, created_at, updated_at]
      description: |
        A row of `projects` (§6.5). No financial column, no contract, no amount. Only the client's id: the client's name
        is read through `party.client.read`, which a site engineer does not hold.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        project_code:
          type: string
        client_party_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        status:
          type: string
          enum: [active, archived]
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
          description: ISO 4217, from the `currencies` reference. No default currency is assumed.
        legacy_type_label:
          type: [string, 'null']
          description: Read-only trace of the old `projects.type` (§3.2); never used to classify.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProjectCreate:
      type: object
      additionalProperties: false
      required: [client_party_id, name, currency_code]
      properties:
        project_code:
          type: string
          maxLength: 50
          description: Optional. Left out or empty, the server generates it (*approved* 2026-11-21, O-1).
        client_party_id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
          minLength: 1
          maxLength: 200
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Required, no default in the contract; the screen pre-fills the company's base currency (*approved* 2026-11-21, O-3).
    ProjectUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        start_date:
          type: [string, 'null']
          format: date
        end_date:
          type: [string, 'null']
          format: date
    ProjectResponse:
      type: object
      additionalProperties: false
      required: [project, session]
      properties:
        project:
          $ref: '#/components/schemas/Project'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    ProjectListResponse:
      type: object
      additionalProperties: false
      required: [projects, page, session]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
        page:
          $ref: '#/components/schemas/PageInfo'
        session:
          $ref: '#/components/schemas/SessionGenerations'

    Assignment:
      type: object
      additionalProperties: false
      required: [id, project_id, membership_id, assignment_role]
      description: A row of `project_assignments` (§6.5). Points to a membership, not to a global user.
      properties:
        id:
          $ref: '#/components/schemas/Id'
        project_id:
          $ref: '#/components/schemas/Id'
        membership_id:
          $ref: '#/components/schemas/Id'
        assignment_role:
          type: [string, 'null']
          description: Free text (`text` in the backend); not used to compute the scope (*approved* 2026-11-21, O-14).
    AssignmentCreate:
      type: object
      additionalProperties: false
      required: [membership_id]
      properties:
        membership_id:
          $ref: '#/components/schemas/Id'
        assignment_role:
          type: string
          minLength: 1
          maxLength: 50
    AssignmentResponse:
      type: object
      additionalProperties: false
      required: [assignment, session]
      properties:
        assignment:
          $ref: '#/components/schemas/Assignment'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    AssignmentListResponse:
      type: object
      additionalProperties: false
      required: [assignments, session]
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        session:
          $ref: '#/components/schemas/SessionGenerations'

    # ── S3 (1.3.0-draft, NOT APPROVED). Every schema that carries money is marked x-ambs-zone: F1 ──
    DecimalAmount:
      type: string
      x-ambs-zone: F1
      pattern: '^(0|[1-9][0-9]{0,13})(\.[0-9]{1,4})?$'
      description: |
        Money as decimal text, never a JSON number (no binary floating point anywhere). Up to 14 integer digits and 4
        decimals (`NUMERIC(18,4)`, ADR-003), not negative (§6.8: CHECK amount >= 0). In a request it has no more decimals
        than the currency's `decimals`; nothing is rounded (rounding rules are FIN-005, open).
      examples: ['1250.00']
    Money:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required: [amount, currency_code, decimals]
      description: |
        An amount in a response, with its currency and the number of decimals it is shown with (ADR-003 API rule: never a
        bare number). `amount` has exactly `decimals` decimals.
      properties:
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        decimals:
          type: integer
          minimum: 0
          maximum: 4
          description: From `currencies.decimals` (ADR-003), never hard-coded.
    ExpenseApprovalStatus:
      type: string
      x-ambs-zone: F1
      enum: [draft, submitted, approved, rejected, cancelled, voided]
      description: |
        PROPOSED values: the backend has `approval_status text` with no values defined (ERD). Transitions: draft →
        submitted → approved | rejected; rejected → submitted; draft | submitted | rejected → cancelled; approved → voided.
        Any other move is `409 invalid_transition`.
    ExpenseSettlementStatus:
      type: string
      x-ambs-zone: F1
      enum: [unpaid, partially_paid, paid]
      description: As the backend (§6.8). Approved is not paid.
    ExpenseCategory:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required: [id, name, active]
      properties:
        id:
          $ref: '#/components/schemas/Id'
        name:
          type: string
        active:
          type: boolean
    ExpenseCategoryCreate:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
    ExpenseCategoryUpdate:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
    ExpenseCategoryResponse:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required: [category, session]
      properties:
        category:
          $ref: '#/components/schemas/ExpenseCategory'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    ExpenseCategoryListResponse:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required: [categories, session]
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/ExpenseCategory'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    Expense:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required:
        [
          id,
          project_id,
          supplier_party_id,
          category_id,
          amount,
          tax_amount,
          incurred_on,
          approval_status,
          settlement_status,
          paid_on,
          paid_amount,
          description,
          created_at,
          updated_at
        ]
      description: |
        A row of `expenses` (ERD EXPENSES, §6.8), ZONE-F1. No ZONE-F2 value (budget, contract value) and no cost
        classification here (`cost_classifications` is its own, later contract). The FX fields of ADR-003 (`base_amount`,
        `fx_rate`, `fx_rate_date`, `fx_rate_source`) are not shown: no currency conversion at launch (S3-design D-4).
      properties:
        id:
          $ref: '#/components/schemas/Id'
        project_id:
          $ref: '#/components/schemas/Id'
        supplier_party_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        category_id:
          $ref: '#/components/schemas/Id'
        amount:
          $ref: '#/components/schemas/Money'
        tax_amount:
          oneOf:
            - $ref: '#/components/schemas/Money'
            - type: 'null'
        incurred_on:
          type: string
          format: date
          description: When the cost was incurred (L2a timing). Not a payment date.
        approval_status:
          $ref: '#/components/schemas/ExpenseApprovalStatus'
        settlement_status:
          $ref: '#/components/schemas/ExpenseSettlementStatus'
        paid_on:
          type: [string, 'null']
          format: date
          description: The date of the latest payment (L3 timing); null while unpaid.
        paid_amount:
          $ref: '#/components/schemas/Money'
        description:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ExpenseCreate:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required: [project_id, category_id, amount, currency_code, incurred_on]
      properties:
        project_id:
          $ref: '#/components/schemas/Id'
        category_id:
          $ref: '#/components/schemas/Id'
        supplier_party_id:
          $ref: '#/components/schemas/Id'
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        tax_amount:
          $ref: '#/components/schemas/DecimalAmount'
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
          description: Required, no default; must be the project's currency.
        incurred_on:
          type: string
          format: date
        description:
          type: string
          maxLength: 500
    ExpenseUpdate:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      minProperties: 1
      dependentRequired:
        amount: [currency_code]
        tax_amount: [currency_code]
      properties:
        category_id:
          $ref: '#/components/schemas/Id'
        supplier_party_id:
          oneOf:
            - $ref: '#/components/schemas/Id'
            - type: 'null'
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        tax_amount:
          oneOf:
            - $ref: '#/components/schemas/DecimalAmount'
            - type: 'null'
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        incurred_on:
          type: string
          format: date
        description:
          type: [string, 'null']
          maxLength: 500
    ExpenseReason:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
    ExpensePayment:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required: [amount, currency_code, paid_on]
      properties:
        amount:
          $ref: '#/components/schemas/DecimalAmount'
        currency_code:
          type: string
          pattern: '^[A-Z]{3}$'
        paid_on:
          type: string
          format: date
    ExpenseResponse:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required: [expense, session]
      properties:
        expense:
          $ref: '#/components/schemas/Expense'
        session:
          $ref: '#/components/schemas/SessionGenerations'
    ExpenseListResponse:
      type: object
      x-ambs-zone: F1
      additionalProperties: false
      required: [expenses, page, session]
      properties:
        expenses:
          type: array
          items:
            $ref: '#/components/schemas/Expense'
        page:
          $ref: '#/components/schemas/PageInfo'
        session:
          $ref: '#/components/schemas/SessionGenerations'

  responses:
    NotDefined:
      description: Placeholder — not defined until its blocking decision is made
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedBody'
    Unauthenticated:
      description: No valid session, so no generations. Never carries Set-Cookie (§4.2, r9).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthenticatedBody'
          example: { error: { code: unauthenticated, message: Your session in this browser has ended } }
    Forbidden:
      description: |
        `permission_denied`, `membership_revoked` or `tenant_selection_denied`; and, PROPOSED for S3,
        `subscription_read_only` (a change to an expense while the subscription is expired or suspended, backend C15).
        The session stays.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: permission_denied, message: You do not have permission for this action }
            session: { generation: 2, context_generation: 1 }
    NotFound:
      description: Not found or not visible to this user in this company (no hint which)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: not_found, message: Item not found }
            session: { generation: 2, context_generation: 1 }
    Conflict:
      description: |
        `tenant_changed` (a stale `X-AMBS-Context-Generation`), `context_required`, `context_ended`,
        `session_rotated`, `operation_in_progress`, or an S1 rule code (`last_owner`, `self_revocation_denied`,
        `already_member`, `invitation_pending`, `currency_locked`), or an S2 rule code (`code_taken`, `client_archived`,
        `project_archived`, `already_assigned`), or an S3 rule code PROPOSED in 1.3.0-draft (`expense_not_editable`,
        `invalid_transition`, `overpayment`, `currency_mismatch`, `category_inactive`, `supplier_inactive`,
        `expense_paid`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: tenant_changed, message: The company changed in another tab }
            session: { generation: 3, context_generation: 2 }
    BadRequest:
      description: |
        `invalid_request` (invalid input), or `context_generation_required` (the `X-AMBS-Context-Generation` header is
        missing or malformed: a fault in the page, shown as an error and never answered by reloading)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: context_generation_required, message: The request could not be sent completely }
            session: { generation: 2, context_generation: 1 }
    IdempotencyKeyReused:
      description: The same Idempotency-Key with another fingerprint (method, path, body or sent X-AMBS-Context-Generation)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: idempotency_key_reused, message: The request could not be accepted }
            session: { generation: 2, context_generation: 1 }
    RateLimited:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
          example:
            error: { code: rate_limited, message: Too many attempts in a short time }
            session: { generation: 2, context_generation: 1 }
    Unavailable:
      description: '`service_unavailable` or `operation_outcome_unknown` (repeat with the same Idempotency-Key only)'
      content:
        application/json:
          schema:
